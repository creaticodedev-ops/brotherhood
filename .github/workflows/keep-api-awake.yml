# Render's free plan puts the API to sleep after 15 idle minutes; the next visitor then waits about a minute.
# Pinging the health route every 10 minutes keeps it awake. GitHub may delay scheduled runs by a few minutes.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://brotherhood-nafz.onrender.com/api/health
